{% extends "base.html" %}
{% block title %}Edit Task · TaskFlow{% endblock %}
{% block content %}
<div class="auth-page">
  <div class="auth-card wide">
    <a class="back" href="{{ url_for('dashboard') }}">← Back to dashboard</a>
    <p class="eyebrow">UPDATE TASK</p>
    <h1>Edit task</h1>
    <form method="POST" class="form">
      <label>Task title
        <input name="title" value="{{ task.title }}" required>
      </label>
      <label>Description
        <textarea name="description" rows="4">{{ task.description or '' }}</textarea>
      </label>
      <div class="two-col">
        <label>Due date
          <input type="date" name="due_date" value="{{ task.due_date or '' }}">
        </label>
        <label>Priority
          <select name="priority">
            {% for p in ['High','Medium','Low'] %}
            <option {% if task.priority == p %}selected{% endif %}>{{ p }}</option>
            {% endfor %}
          </select>
        </label>
      </div>
      <label>Status
        <select name="status">
          <option {% if task.status == 'Pending' %}selected{% endif %}>Pending</option>
          <option {% if task.status == 'Completed' %}selected{% endif %}>Completed</option>
        </select>
      </label>
      <button class="btn primary full" type="submit">Save Changes</button>
    </form>
  </div>
</div>
{% endblock %}
