{% extends "base.html" %}
{% block title %}Register · TaskFlow{% endblock %}
{% block content %}
<div class="auth-page">
  <div class="auth-card">
    <div class="brand">Task<span>Flow</span></div>
    <p class="eyebrow">GET STARTED</p>
    <h1>Create your account</h1>
    <p class="muted">Organize your work, studies and personal tasks in one place.</p>
    <form method="POST" class="form">
      <label>Name
        <input type="text" name="name" placeholder="Your name" required>
      </label>
      <label>Email
        <input type="email" name="email" placeholder="you@example.com" required>
      </label>
      <label>Password
        <input type="password" name="password" placeholder="Create a password" minlength="6" required>
      </label>
      <button class="btn primary full" type="submit">Create Account</button>
    </form>
    <p class="switch">Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
  </div>
</div>
{% endblock %}
