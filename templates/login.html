{% extends "base.html" %}
{% block title %}Login · TaskFlow{% endblock %}
{% block content %}
<div class="auth-page">
  <div class="auth-card">
    <div class="brand">Task<span>Flow</span></div>
    <p class="eyebrow">YOUR DAILY ORGANIZER</p>
    <h1>Welcome back</h1>
    <p class="muted">Log in to manage your tasks and keep your day on track.</p>
    <form method="POST" class="form">
      <label>Email
        <input type="email" name="email" placeholder="you@example.com" required>
      </label>
      <label>Password
        <input type="password" name="password" placeholder="••••••••" required>
      </label>
      <button class="btn primary full" type="submit">Log In</button>
    </form>
    <p class="switch">Don't have an account? <a href="{{ url_for('register') }}">Create one</a></p>
  </div>
</div>
{% endblock %}
